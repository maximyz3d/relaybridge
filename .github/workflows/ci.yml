name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Linux / Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install and qualify Linux namespace test dependency
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap
          /usr/bin/bwrap --version
          # Exercise the boundary on this ephemeral CI VM before the native tests.
          # The read-only root bind is a feature probe, not a provider launch profile.
          check_boundary_namespace() {
            timeout 10s /usr/bin/bwrap --unshare-all --unshare-user --as-pid-1 \
              --die-with-parent --cap-drop ALL --disable-userns --assert-userns-disabled \
              --ro-bind / / --proc /proc --dev /dev -- /bin/true
          }
          if ! check_boundary_namespace; then
            # Ubuntu 24.04 may restrict userns setup capabilities through AppArmor.
            # This runner-only policy change must not enter installers or runtime.
            if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
              sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            fi
            check_boundary_namespace
          fi

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev

  windows:
    name: Windows / Node 24
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Test Windows MCP registration lifecycle
        run: npm run test:install-mcp

      - name: Test Windows installer lifecycle
        run: npm run test:install

      - name: Audit production dependencies
        run: npm audit --omit=dev
