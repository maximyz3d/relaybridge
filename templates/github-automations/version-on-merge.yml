# rb-template v3
# .github/workflows/version-on-merge.yml
#
# GitHub-native version tracking. This is the SOURCE OF TRUTH for versions —
# it runs on GitHub for every merged PR, whether or not RelayBridge was involved.
#
# How the version is decided: the PR's label.
#   - no label            -> patch bump   (small fixes: 0.0.X)
#   - label "bump:minor"  -> minor bump   (features:    0.X.0)
#   - label "bump:major"  -> major bump   (big release: X.0.0)
#   - label "set-version:1.4.0" -> set exactly to 1.4.0 (only if greater)
# RelayBridge applies that label automatically; you can also add it by hand.
#
# On merge it: computes the next version, writes VERSION + CHANGELOG.md on the
# default branch, and creates an annotated tag vX.Y.Z (your archive / rollback
# point). Set repo variable CREATE_RELEASE=true to also cut a GitHub Release.
#
# NOTE: if your default branch is protected against direct pushes, allow the
# github-actions bot to bypass it, or swap GITHUB_TOKEN for a PAT with repo scope.

name: Version on merge

on:
  # This workflow must retain contents:write after a maintainer merges a fork
  # or Dependabot PR. It never checks out or executes the PR head: the target
  # event supplies the trusted default-branch workflow and base ref.
  pull_request_target:
    types: [closed]

permissions:
  contents: write

# A single repository-wide queue prevents two merge events from selecting the
# same baseline/tag. Never cancel a release job that has already started.
concurrency:
  group: version-on-merge-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  version:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0        # need full history + tags

      - name: Decide the bump from PR labels
        id: bump
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const labels = context.payload.pull_request.labels.map(l => l.name);
            const setLabels = labels.filter(l => l.startsWith('set-version:'));
            if (setLabels.length > 1) {
              throw new Error(`Expected at most one set-version label, found: ${setLabels.join(', ')}`);
            }
            let bump = 'patch', setVersion = '';
            if (setLabels.length === 1) {
              setVersion = setLabels[0].slice('set-version:'.length);
            }
            else if (labels.includes('bump:major')) bump = 'major';
            else if (labels.includes('bump:minor')) bump = 'minor';
            core.setOutput('bump', bump);
            core.setOutput('set_version', setVersion);
            core.setOutput('set_version_present', String(setLabels.length === 1));

      - name: Compute next version
        id: version
        env:
          BUMP: ${{ steps.bump.outputs.bump }}
          SET_VERSION: ${{ steps.bump.outputs.set_version }}
          SET_VERSION_PRESENT: ${{ steps.bump.outputs.set_version_present }}
        run: node .github/scripts/compute-version.cjs >> "$GITHUB_OUTPUT"

      - name: Write, commit, and tag
        env:
          BUMP: ${{ steps.bump.outputs.bump }}
          SET_VERSION: ${{ steps.bump.outputs.set_version }}
          CURRENT_VERSION: ${{ steps.version.outputs.current }}
          NEW_VERSION: ${{ steps.version.outputs.next }}
          VERSION_SOURCE: ${{ steps.version.outputs.source }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          echo "Version: $CURRENT_VERSION -> $NEW_VERSION (source=$VERSION_SOURCE bump=$BUMP set=$SET_VERSION)"

          # guard: never overwrite an existing tag
          if git show-ref --verify --quiet "refs/tags/v$NEW_VERSION"; then
            echo "Tag v$NEW_VERSION already exists — aborting to keep history append-only." >&2
            exit 1
          fi

          echo "$NEW_VERSION" > VERSION
          DATE=$(date +%Y-%m-%d)
          TMP=$(mktemp)
          { echo "## v$NEW_VERSION - $DATE"; echo "- #$PR_NUMBER $PR_TITLE"; echo ""; \
            [ -f CHANGELOG.md ] && cat CHANGELOG.md; } > "$TMP"
          mv "$TMP" CHANGELOG.md

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION CHANGELOG.md
          git commit -m "chore(release): v$NEW_VERSION [skip ci]"
          git tag -a "v$NEW_VERSION" -m "v$NEW_VERSION"
          git push --atomic origin \
            "HEAD:refs/heads/$BASE_REF" \
            "refs/tags/v$NEW_VERSION:refs/tags/v$NEW_VERSION"
          echo "NEW_VERSION=$NEW_VERSION" >> "$GITHUB_ENV"

      - name: Cut a GitHub Release (optional)
        if: vars.CREATE_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # Quoted deliberately. In an unquoted YAML plain scalar the " #"
          # that opens the PR reference starts a COMMENT, so this value
          # parsed as the bare string "Auto-release for" and every auto-cut
          # Release shipped with no PR number and no title — the archive is
          # the documented rollback point, and its provenance was empty.
          # The notes still reach the shell as an env var and are never
          # interpolated into the run: script, so a PR title cannot inject.
          RELEASE_NOTES: "Auto-release for #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}"
        run: |
          gh release create "v$NEW_VERSION" \
            --title "v$NEW_VERSION" \
            --notes "$RELEASE_NOTES"
